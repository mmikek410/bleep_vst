# Builds both BLEEP / 001 plugins for macOS Apple Silicon (arm64) on ONE runner:
#   - BLEEP 001          (main project, Blpa/Bl02)               -> artifact BLEEP001-macOS-arm64
#   - BLEEP 001 Classic  (classic/, frozen Phase 1, Blpa/Bl01)   -> artifact BLEEP001-Classic-macOS-arm64
# Each is built, tested, ad-hoc signed and zipped; then both are installed
# side by side and checked for collisions and validated in a host.
#
# Why one job: GitHub's macOS arm64 runners are capacity-limited; parallel
# jobs were repeatedly never assigned a runner. Sequential is slower but reliable.
# No secrets are used or needed.

name: Build macOS (arm64)

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JUCE_TAG: 9.0.5

jobs:
  build:
    name: Build BLEEP 001 + BLEEP 001 Classic
    runs-on: macos-15          # Apple Silicon (arm64) runner
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          cmake --version | head -1

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: external/JUCE
          key: juce-${{ env.JUCE_TAG }}

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git external/JUCE

      # ---------------- BLEEP 001 (current) ----------------
      - name: BLEEP 001 - build, test, sign, package
        id: main
        run: |
          bash .github/scripts/build_variant.sh . "$GITHUB_WORKSPACE/build-main" "BLEEP 001" \
            BLEEP001-macOS-arm64 Bl02 "bleep_tests bleep_seq_tests bleep_gen_tests bleep_plugin_tests"
          echo "zip=$(cat build-main/zip_path.txt)" >> "$GITHUB_OUTPUT"

      - name: BLEEP 001 - upload
        uses: actions/upload-artifact@v4
        with:
          name: BLEEP001-macOS-arm64
          path: ${{ steps.main.outputs.zip }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: BLEEP 001 - UI screenshot
        continue-on-error: true
        run: |
          cmake --build build-main --config Release --target bleep_ui_snapshot -j "$(sysctl -n hw.ncpu)"
          mkdir -p ui-screenshots
          ./build-main/bleep_ui_snapshot "$GITHUB_WORKSPACE/ui-screenshots"

      - name: BLEEP 001 - upload UI screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: BLEEP001-UI-screenshots
          path: ui-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 30

      # ---------------- BLEEP 001 Classic (frozen Phase 1) ----------------
      - name: BLEEP 001 Classic - build, test, sign, package
        id: classic
        if: ${{ !cancelled() }}
        run: |
          bash .github/scripts/build_variant.sh classic "$GITHUB_WORKSPACE/build-classic" "BLEEP 001 Classic" \
            BLEEP001-Classic-macOS-arm64 Bl01 "bleep_tests bleep_plugin_tests"
          echo "zip=$(cat build-classic/zip_path.txt)" >> "$GITHUB_OUTPUT"

      - name: BLEEP 001 Classic - upload
        if: ${{ !cancelled() && steps.classic.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: BLEEP001-Classic-macOS-arm64
          path: ${{ steps.classic.outputs.zip }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ---------------- Side by side + host validation ----------------
      - name: Install both like a user would
        run: |
          set -euo pipefail
          rm -rf ~/Library/Audio/Plug-Ins/VST3/BLEEP* ~/Library/Audio/Plug-Ins/Components/BLEEP*
          mkdir -p unpacked
          for z in "${{ steps.main.outputs.zip }}" "${{ steps.classic.outputs.zip }}"; do ditto -x -k "$z" unpacked; done
          for d in unpacked/*/; do (cd "$d" && bash install.sh); done
          ls -la ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/Components

      - name: Verify the identities do not collide
        run: |
          python3 .github/scripts/check_coexistence.py \
            ~/Library/Audio/Plug-Ins/VST3/"BLEEP 001.vst3" \
            ~/Library/Audio/Plug-Ins/VST3/"BLEEP 001 Classic.vst3"

      - name: Fetch pluginval
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip

      - name: pluginval - BLEEP 001 (strictness 5)
        run: |
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests \
            --validate-in-process --validate ~/Library/Audio/Plug-Ins/VST3/"BLEEP 001.vst3"

      - name: pluginval - BLEEP 001 Classic (strictness 5)
        run: |
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests \
            --validate-in-process --validate ~/Library/Audio/Plug-Ins/VST3/"BLEEP 001 Classic.vst3"

      - name: auval - both AUs registered and valid
        continue-on-error: true
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep "Blpa" || true
          auval -v aumu Bl02 Blpa | tail -3
          auval -v aumu Bl01 Blpa | tail -3

      - name: Summary
        if: always()
        run: |
          {
            echo "## BLEEP / 001 macOS arm64"
            echo "- BLEEP 001: ${{ steps.main.outcome }} -> artifact \`BLEEP001-macOS-arm64\` (aumu Bl02 Blpa)"
            echo "- BLEEP 001 Classic: ${{ steps.classic.outcome }} -> artifact \`BLEEP001-Classic-macOS-arm64\` (aumu Bl01 Blpa)"
          } >> "$GITHUB_STEP_SUMMARY"
